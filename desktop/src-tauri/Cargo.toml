[package]
name = "love-roulette-plancia"
version = "0.1.0"
description = "CasaPad Mac — Love Roulette plancia animatore"
authors = ["MusicPro Eventi"]
edition = "2021"

[lib]
name = "love_roulette_plancia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
